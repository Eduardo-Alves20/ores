name: Deploy Ubuntu Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, vps, ores, prod]

    env:
      DEPLOY_DIR: /opt/ores/ores

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync project files to deploy folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"

          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "uploads/" \
            --exclude "logs/" \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

      - name: Validate deploy environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          if [ ! -f ".env" ]; then
            echo "Arquivo .env nao encontrado em $DEPLOY_DIR. Configure antes do deploy."
            exit 1
          fi

      - name: Rebuild and restart containers
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose pull || true
          docker compose up -d --build --force-recreate --remove-orphans

      - name: Wait for app healthcheck
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          cid="$(docker compose ps -q ores)"
          if [ -z "$cid" ]; then
            echo "Container ores not found"
            docker compose ps
            exit 1
          fi
          for i in $(seq 1 40); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$cid")"
            if [ "$status" = "healthy" ]; then
              echo "App healthy"
              exit 0
            fi
            sleep 3
          done
          echo "App did not become healthy in time"
          docker compose ps
          docker compose logs --tail=120 ores
          exit 1
