services:
  mongo:
    image: mongo:7
    restart: always
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 768m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet --host 127.0.0.1 --port 27017 -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin | grep 1 >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ores:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - ores_uploads:/app/uploads
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      PORT: 4000
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      MONGO_URI: ${MONGO_URI_DOCKER}
      ASSISTIDO_UPLOADS_DIR: /app/uploads/assistido-anexos
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.request({host:'127.0.0.1',port:4000,path:'/health',timeout:5000},(res)=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.end();\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ores_uploads:
    external: true
    name: ${UPLOADS_VOLUME:-ores_uploads_data}
  mongo_data:
    external: true
    name: ${MONGO_DATA_VOLUME:-ores_mongo_data}
